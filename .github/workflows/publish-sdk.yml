name: publish-sdk

# Publish an immutable aai-core wheel to a Unity Catalog volume. Run this
# workflow from main so the branch-ref OIDC subject matches the federated
# credential. It intentionally has no GitHub environment and uses no secret.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact pyproject.toml version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Databricks CLI for credential-free template rendering
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Re-run the release acceptance gate
        run: |
          python -m pip install uv==0.8.23
          uv sync --python 3.12 --extra dev --extra all --locked
          ./scripts/cloud-verify.sh
          uv run --python 3.12 python \
            templates/_shared/files/scripts/audit_dependencies.py \
            --policy templates/_shared/files/security-audit.toml \
            --uv-project .

      - name: Build and verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$PACKAGE_VERSION" = "$REQUESTED_VERSION"
          WHEEL="dist/aai_core-${PACKAGE_VERSION}-py3-none-any.whl"
          test -f "$WHEEL"
          (
            cd dist
            sha256sum "aai_core-${PACKAGE_VERSION}-py3-none-any.whl" \
              > "aai_core-${PACKAGE_VERSION}-py3-none-any.whl.sha256"
          )
          uv run --python 3.12 python scripts/validate_release.py \
            --wheel "$WHEEL" \
            --release-version "$PACKAGE_VERSION" \
            --require-tag \
            --write-manifest dist/release-manifest.json

      - name: Stage wheel and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aai-core-release
          path: |
            dist/*.whl
            dist/*.sha256
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN in .git/config on a runner that later runs
          # third-party actions (defense-in-depth for the credentialed job).
          persist-credentials: false

      - name: Download staged release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aai-core-release
          path: dist

      - name: Verify the publication script is the reviewed one
        # This job holds a live credential, so the code that decides whether a
        # release may be overwritten must come from the protected commit under
        # review — not from the build artifact, and not from a dirty tree.
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Verify the externally configured publication target
        env:
          SDK_ARTIFACT_VOLUME: ${{ vars.SDK_ARTIFACT_VOLUME }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("dist/release-manifest.json").read_text())
          actual = os.environ.get("SDK_ARTIFACT_VOLUME", "")
          expected = manifest["sdk_artifact_volume"]
          if not actual:
              raise SystemExit("SDK_ARTIFACT_VOLUME is not configured")
          if actual != expected:
              raise SystemExit(
                  "SDK_ARTIFACT_VOLUME differs from the reviewed release manifest"
              )
          if os.environ["PACKAGE_VERSION"] != manifest["version"]:
              raise SystemExit("requested version differs from the release manifest")
          PY

      - name: Azure login (OIDC — no secret)
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Publish immutable release
        # The refusal, resume, and verification rules live in a unit-tested
        # script (tests/test_publish_release.py). This step must stay a thin
        # call: rule 12 is the most expensive rule to get wrong, and inline
        # shell here would again be untestable and unexecuted until a real
        # release ran it for the first time.
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          SDK_ARTIFACT_VOLUME: ${{ vars.SDK_ARTIFACT_VOLUME }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/publish_release.py \
            --artifact-dir dist \
            --volume "$SDK_ARTIFACT_VOLUME" \
            --version "$PACKAGE_VERSION"
