name: deploy

# Keyless deploy of the Databricks Asset Bundle to the dev workspace.
# Triggers: push to main (fully automated) and manual dispatch.
#
# NOTE: this job intentionally sets NO `environment:`. The federated credential
# subject is the branch-ref form (repo:<owner>/<repo>:ref:refs/heads/main); a
# GitHub environment would change the OIDC subject to :environment:<name> and
# break the token exchange. To add an environment gate, first add a matching
# FIC in infra/identity.tf.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN in .git/config on a runner that later runs
          # third-party actions (defense-in-depth for the credentialed job).
          persist-credentials: false

      - name: Azure login (OIDC — no secret)
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The CI SP has NO ARM RBAC (Databricks-only), so it can see no
          # subscription. allow-no-subscriptions lets az login succeed with just
          # the tenant token — which is all the Databricks azure-cli auth needs.
          # (subscription-id is intentionally NOT passed for the same reason.)
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        # Pinned to a commit SHA (supply-chain hardening): this step runs AFTER
        # azure/login with a live SP token on the runner, so a mutable ref here
        # could exfiltrate it. Bump via:
        #   gh api "repos/databricks/setup-cli/tags?per_page=8"
        # then update the SHA and the trailing version comment.
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Validate & deploy bundle (dev)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
