name: deploy

# Keyless deploy of the Databricks Asset Bundle to the dev workspace.
# Triggers: push to main (fully automated) and manual dispatch.
#
# NOTE: this job intentionally sets NO `environment:`. The federated credential
# subject is the branch-ref form (repo:<owner>/<repo>:ref:refs/heads/main); a
# GitHub environment would change the OIDC subject to :environment:<name> and
# break the token exchange. Before adding an environment gate, have the
# platform identity owner add a matching federated credential externally.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bind_app:
        description: >-
          One-time only. Name of the pre-created platform console app to bind to the
          bundle before deploying (for example aai-platform-console-dev). The dedicated
          principal exists only inside this OIDC job, so this is the only place the bind
          can be performed in the deployment state CI actually uses. Leave empty for
          every normal deploy. See docs/platform-console.md.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build SDK wheel before cloud login
        run: |
          python -m pip install uv==0.8.23
          uv sync --python 3.12 --extra dev --locked
          uv run --python 3.12 python -m build --wheel --no-isolation
          uv run --python 3.12 python scripts/validate_release.py --wheel dist

      - name: Stage SDK wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aai-core-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  deploy-dev:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave GITHUB_TOKEN in .git/config on a runner that later runs
          # third-party actions (defense-in-depth for the credentialed job).
          persist-credentials: false

      - name: Download prebuilt SDK wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aai-core-wheel
          path: dist

      - name: Azure login (OIDC — no secret)
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The CI SP has NO ARM RBAC (Databricks-only), so it can see no
          # subscription. allow-no-subscriptions lets az login succeed with just
          # the tenant token — which is all the Databricks azure-cli auth needs.
          # (subscription-id is intentionally NOT passed for the same reason.)
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        # Pinned to a commit SHA (supply-chain hardening): this step runs AFTER
        # azure/login with a live SP token on the runner, so a mutable ref here
        # could exfiltrate it. Bump via:
        #   gh api "repos/databricks/setup-cli/tags?per_page=8"
        # then update the SHA and the trailing version comment.
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Bind the pre-created console app (one-time, manual dispatch only)
        # `bundle deploy` does NOT adopt a workspace app because the name matches: without
        # a binding in the deployment state it plans a new app and attempts the creation
        # that AGENTS.md rule 8 reserves for the platform owner. Deployment state under
        # `mode: development` lives in the deploying principal's home, so a bind run from
        # a laptop is invisible here — it has to happen in this job.
        #
        # Runs before deploy in the same job so one dispatch binds and deploys atomically.
        # The app name goes through `env` and is referenced as a shell variable, never
        # interpolated into the script body (zizmor template-injection; this job holds a
        # live service-principal token).
        if: inputs.bind_app != ''
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          CONSOLE_APP_NAME: ${{ inputs.bind_app }}
        run: |
          databricks bundle deployment bind platform_console "$CONSOLE_APP_NAME" \
            -t dev --auto-approve

      - name: Validate & deploy bundle (dev)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          # Cost-attribution values, sourced from repo *variables* (non-secret;
          # set under Settings → Secrets and variables → Actions → Variables).
          # These feed the bundle vars in databricks.yml → presets.tags and the
          # cluster custom_tags. The fallbacks are placeholders — set the repo
          # variables to real values so an unset variable never emits an empty tag.
          BUNDLE_VAR_cost_center: ${{ vars.COST_CENTER || 'CC-1234' }}
          BUNDLE_VAR_team: ${{ vars.TEAM || 'data-platform' }}
          BUNDLE_VAR_owner_group: ${{ vars.OWNER_GROUP || 'group:data-platform-owners' }}
          AAI_USE_PREBUILT_WHEEL: "1"
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev

      - name: Validate template catalog against the workspace
        # Renders every bundle template and runs a real `bundle validate`
        # (resource schemas incl. vector search indexes) — the check PR CI
        # cannot do credential-free. Results land on the step summary.
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: python3 scripts/validate_templates.py
