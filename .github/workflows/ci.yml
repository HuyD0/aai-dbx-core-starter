name: CI

# Credential-FREE checks for pull requests. There is intentionally NO
# `id-token: write` permission and NO azure/login here, so a PR from any branch
# (including forks) can never obtain Azure or Databricks credentials.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dev tooling
        run: |
          python -m pip install uv==0.8.23
          uv lock --check
          uv sync --python 3.12 --extra dev --extra all --locked

      - name: Install Databricks CLI for local template rendering
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Cloud-container verification (credential-free)
        # Includes the zizmor workflow-security lint via the locked dev env.
        run: ./scripts/cloud-verify.sh

      - name: Validate SDK, template, and built-wheel contracts
        run: uv run --python 3.12 python scripts/validate_release.py --wheel dist

  classification-course:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked local classification course
        run: |
          python -m pip install uv==0.8.23
          make -C examples/local-classification install

      - name: Test code and execute every notebook twice
        run: make -C examples/local-classification check

      - name: Audit the course runtime dependency closure
        run: |
          examples/local-classification/.venv/bin/python \
            templates/_shared/files/scripts/audit_dependencies.py \
            --policy templates/_shared/files/security-audit.toml \
            --requirement \
            examples/local-classification/src/aai_local_classification/model-requirements.lock

  python-311:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Databricks CLI for local template rendering
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Install and test Python 3.11 compatibility
        run: |
          python -m pip install uv==0.8.23
          uv sync --python 3.11 --extra dev --extra all --locked
          uv pip check --python .venv/bin/python
          uv run --python 3.11 pytest -q

      - name: Install the classification course on Python 3.11
        run: make -C examples/local-classification install

      - name: Test classification runtime compatibility on Python 3.11
        run: |
          make -C examples/local-classification test
          make -C examples/local-classification notebook-check

  provider-extras:
    name: Provider and Foundry contracts / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the certified provider and Foundry stacks
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python -m pip install uv==0.8.23
          uv sync \
            --python "$PYTHON_VERSION" \
            --extra dev \
            --extra all \
            --extra foundry-labs \
            --locked
          uv pip install \
            --python .venv/bin/python \
            --requirements templates/agent-app/template/recipes/langgraph/requirements.lock
          uv pip check --python .venv/bin/python

      - name: Exercise the optional LangGraph durability contract
        env:
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: |
          .venv/bin/python -m pytest -q \
            templates/agent-app/template/recipes/langgraph/test_graph.py

      - name: Verify generated transitive template locks
        if: matrix.python == '3.12'
        run: |
          .venv/bin/python \
            scripts/lock_template_dependencies.py --check

      - name: Audit installed dependencies
        run: |
          .venv/bin/python \
            templates/_shared/files/scripts/audit_dependencies.py \
            --policy templates/_shared/files/security-audit.toml \
            --installed-python .venv/bin/python

      - name: Audit every generated runtime lock
        if: matrix.python == '3.12'
        run: |
          while IFS= read -r lock; do
            echo "auditing $lock"
            .venv/bin/python \
              templates/_shared/files/scripts/audit_dependencies.py \
              --policy templates/_shared/files/security-audit.toml \
              --requirement "$lock"
          done < <(
            { find templates -name requirements.lock -type f -print; \
              printf '%s\n' \
                examples/local-classification/src/aai_local_classification/model-requirements.lock; \
            } | sort -u
          )

      - name: Exercise provider and Foundry import boundaries
        run: |
          .venv/bin/python - <<'PY'
          import a2a
          import agent_framework
          import azure.ai.projects
          import azure.identity
          import azure.keyvault.secrets
          import azure.monitor.opentelemetry
          import azure.search.documents
          import databricks.ai_search.client
          import databricks.sdk
          import databricks_openai
          import mlflow
          import openai
          import opentelemetry.sdk

          print("all certified provider and Foundry extras import successfully")
          PY

      - name: Exercise Foundry curriculum contracts
        run: .venv/bin/python -m pytest -q tests/test_foundry_curriculum.py
