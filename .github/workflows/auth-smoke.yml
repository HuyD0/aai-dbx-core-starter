name: auth-smoke

# Proves the full keyless auth chain independent of any deployment:
#   GitHub OIDC token  ->  azure/login (federated credential)  ->  az
#                      ->  Databricks (Azure CLI token, DATABRICKS_AUTH_TYPE=azure-cli)
# Run it from the `main` branch (Actions tab -> auth-smoke -> Run workflow) so the
# OIDC subject is repo:<owner>/<repo>:ref:refs/heads/main, matching the FIC.
on:
  workflow_dispatch: {}

permissions:
  id-token: write   # required for the GitHub OIDC token
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC — no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Databricks-only SP has no ARM RBAC / no visible subscription.
          allow-no-subscriptions: true

      - name: Confirm Azure identity
        run: az account show -o table || az account list --all -o table

      - name: Install Databricks CLI
        # Pinned to a commit SHA (supply-chain hardening) — runs after azure/login
        # with a live token. Bump via: gh api "repos/databricks/setup-cli/tags".
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Confirm Databricks auth (Azure CLI token — no secret)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          databricks current-user me
          echo "OIDC -> Azure -> Databricks chain verified with zero stored secrets."
