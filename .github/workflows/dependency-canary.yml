name: dependency-canary

# Credential-free compatibility bounds. Pull requests use the certified lock;
# this schedule proves that the lower and upper supported ranges remain honest.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-canary
  cancel-in-progress: true

jobs:
  supported-bounds:
    name: ${{ matrix.python }} / ${{ matrix.resolution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.12"
        resolution:
          - lowest-direct
          - highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve the compatibility bound
        env:
          RESOLUTION: ${{ matrix.resolution }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python -m pip install uv==0.8.23
          uv lock --upgrade --resolution "$RESOLUTION"
          uv sync \
            --python "$PYTHON_VERSION" \
            --extra dev \
            --extra all \
            --locked
          uv pip install \
            --python .venv/bin/python \
            --resolution "$RESOLUTION" \
            "databricks-agents>=1.11,<2" \
            "langchain>=1.3,<1.4" \
            "langgraph>=1.2,<1.3"
          uv pip check --python .venv/bin/python
          .venv/bin/python \
            templates/_shared/files/scripts/audit_dependencies.py \
            --policy templates/_shared/files/security-audit.toml \
            --installed-python .venv/bin/python

      - name: Exercise behavioral compatibility canaries
        env:
          # Durable checkpoints must contain portable data, not permissively
          # deserialized application classes.
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m pytest -q \
            templates/agent-app/template/recipes/langgraph/test_graph.py
          .venv/bin/python - <<'PY'
          import a2a
          import agent_framework
          import azure.ai.projects
          import azure.identity
          import azure.keyvault.secrets
          import azure.monitor.opentelemetry
          import azure.search.documents
          import databricks.ai_search.client
          import databricks.sdk
          import databricks_openai
          import langchain
          import langchain_core
          import mlflow
          import openai
          import opentelemetry.sdk
          import pydantic

          print("provider, tracing, validation, and framework boundaries passed")
          PY
