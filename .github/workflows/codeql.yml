name: CodeQL

# Static analysis is credential-free. The Python lane renders every supported
# template shape into the checkout so CodeQL sees generated application code,
# not only the Go-template sources.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'actions'
        name: Stage generated-project workflows for Actions analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile

          destination = Path(".github/workflows")
          for source in sorted(
              Path("templates").glob("*/template/.github/workflows/*.yml")
          ):
              template = source.parts[1]
              copyfile(source, destination / f"template-{template}-{source.name}")
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: matrix.language == 'python'
        name: Install locked render tooling
        run: |
          python -m pip install uv==0.8.23
          uv sync --python 3.12 --extra dev --locked

      - if: matrix.language == 'python'
        name: Install Databricks CLI for local template rendering
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - if: matrix.language == 'python'
        name: Render every supported application shape
        run: |
          uv run --python 3.12 pytest -q \
            tests/test_template.py -k test_render_matrix \
            --basetemp=.codeql-rendered

      - name: Analyze repository
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
