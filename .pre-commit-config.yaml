minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

# Local hooks only: commits never download and execute third-party hook repos.
repos:
  - repo: local
    hooks:
      - id: aai-pre-commit
        name: AAI credential-free commit checks
        entry: ./scripts/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: aai-pre-push
        name: AAI full credential-free verification
        entry: ./scripts/pre-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
