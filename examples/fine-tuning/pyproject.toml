[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "aai-fine-tuning"
version = "0.1.0"
description = "Notebook-led quantization and LoRA/QLoRA curriculum on CPU-only models with MLflow."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # accelerate is a hard runtime requirement of peft; pinned explicitly so the
  # course controls the version even though no lesson imports it directly.
  "accelerate==1.14.0",
  "mlflow==3.14.0",
  # numpy 2.5.x requires Python >= 3.12; 2.4.x is the newest series that still
  # supports 3.11. Both are NumPy 2.x, so lesson code sees one API surface on
  # both interpreters.
  "numpy==2.5.1; python_version >= '3.12'",
  "numpy==2.4.1; python_version < '3.12'",
  "pandas==2.3.3",
  "peft==0.20.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "torch==2.13.0",
  "transformers==5.15.1",
]

[project.optional-dependencies]
dev = [
  "black[jupyter]==26.5.1",
  "ipykernel==7.3.0",
  "jupyterlab==4.6.2",
  # nbformat is imported directly by scripts/render_notebooks.py.
  "nbformat==5.10.4",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
aai-finetune = "aai_fine_tuning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_fine_tuning"]

[tool.uv]
# The course supports macOS on Apple Silicon and Linux x86_64 only; excluding
# other platforms keeps the universal lock small and unambiguous.
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
# Fail `uv lock` if any dependency lacks a wheel for either supported platform.
# CI only executes on Linux, so this is the lock-time guarantee that the
# Apple Silicon install works.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# Linux resolves torch from the CPU-only index (`torch==X.Y.Z` accepts the
# index's `X.Y.Z+cpu` builds), so the multi-GB CUDA wheels are never
# considered. macOS falls back to PyPI, whose wheels are CPU-only anyway.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# The PyTorch index also hosts stale copies of numpy and friends; explicit
# keeps it torch-only.
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/notebook_content.py" = ["E501"]
"scripts/render_notebooks.py" = ["E501"]
# Each lesson intentionally runs a preflight check before later import cells.
"notebooks/*.ipynb" = ["E402", "E501", "I001"]

[tool.black]
target-version = ["py311", "py312"]
line-length = 88
extend-exclude = "notebooks/.*\\.ipynb"
