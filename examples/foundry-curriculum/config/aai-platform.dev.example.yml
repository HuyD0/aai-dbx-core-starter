platform:
  application: foundry-learning-assistant
  project: foundry-curriculum
  environment: dev
  team: ai-platform
  owner_group: group:ai-platform-owners
  cost_center: learning
  data_classification: internal
  lifecycle: experimental
  repository: replace-with-owner/replace-with-repository
  release: dev
  tag_schema_version: "1"
  catalog: dbx_dev
  schema: foundry_learning
  experiment_name: /Shared/foundry-curriculum
  azure_identity: azure_cli

providers:
  models:
    # Notebooks resolve this logical name. Application code never embeds an
    # environment-specific endpoint or deployment name.
    foundry-chat:
      provider: foundry
      endpoint: https://replace-with-foundry-account.services.ai.azure.com/api/projects/replace-with-project
      deployment: replace-with-model-deployment
      capabilities:
        tool_calling: true
        structured_output: true
      timeout_seconds: 60
      max_retries: 2

# Advanced notebooks consume only identifiers for resources provisioned through
# the approved platform process. A2A endpoints are derived from the project and
# remote-agent names; no notebook stores a bearer token or connection string.
foundry:
  agent:
    name: replace-with-agent-name
    version: replace-with-agent-version
    id: replace-with-agent-id
  evaluation:
    evaluator_model: replace-with-evaluator-model-deployment
  memory:
    store_name: replace-with-memory-store-name
  a2a:
    remote_agent_name: replace-with-remote-agent-name
    connection_name: replace-with-a2a-connection-name
    protocol_version: "1.0"
  observability:
    application_insights_resource_id: replace-with-application-insights-resource-id

# Identifiers and approved secret references only. Never paste keys or tokens.
secrets: {}
