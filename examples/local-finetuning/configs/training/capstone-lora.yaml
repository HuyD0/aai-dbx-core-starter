# MLX-LM 0.31.3 configuration for the advanced compact capstone output.
model: models/qwen2.5-0.5b-instruct-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: data/processed/capstone-mlx-v1
seed: 42
num_layers: 8
batch_size: 1
iters: 100
val_batches: 10
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 25
grad_accumulation_steps: 4
resume_adapter_file: null
adapter_path: artifacts/adapters/capstone-lora-v1
save_every: 25
test: false
test_batches: -1
max_seq_length: 4096
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.0
