[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "aai-local-finetuning"
version = "0.1.0"
description = "Offline-first MLX-LM fine-tuning curriculum for Apple silicon."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
apple = [
  "mlx-lm[train]==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
tracking = [
  "mlflow==3.14.0",
  "pandas==2.3.3",
]
prepare = [
  "huggingface-hub==1.26.0",
  "kaggle==2.2.4",
]
dev = [
  "black[jupyter]==26.5.1",
  "ipykernel==7.3.0",
  "jupyterlab==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
aai-finetune = "aai_local_finetuning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_local_finetuning"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311", "py312"]
line-length = 88
