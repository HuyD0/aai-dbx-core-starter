bundle:
  name: aai-dbx-base-template

# Cost-attribution inputs (non-secret). Each instance of this template MUST set
# `cost_center` and `team` so Databricks usage can be charged back. Override per
# instance without editing this file via any of:
#   * a variable override under a target below,
#   * `databricks bundle deploy --var="cost_center=CC1234,team=platform"`, or
#   * env vars `BUNDLE_VAR_cost_center` / `BUNDLE_VAR_team` (wire these into
#     deploy.yml from repo *variables* — never secrets).
# These values feed both the job/pipeline tags (presets.tags, below) and the
# cluster custom_tags (resources/*.yml) that reach Azure VM billing and the
# `system.billing.usage` table.
variables:
  cost_center:
    description: Finance cost center that this bundle's Databricks usage is charged to.
    default: CC-1234
  team:
    description: Team that owns this bundle.
    default: data-platform
  owner_group:
    description: Non-personal group that owns this bundle's resources.
    default: group:data-platform-owners
  # Environment identifier. The default is this instance's dev policy; a clone
  # overrides it per target or via BUNDLE_VAR_* without editing resource files.
  # tests/test_smoke.py cross-checks this default against
  # platform-identifiers.json (the single source of truth for identifiers).
  # NOTE: workspace.host below must stay a literal — the Databricks CLI forbids
  # variable interpolation in authentication fields. The same smoke test keeps
  # it in sync with platform-identifiers.json.
  job_compute_policy_id:
    description: Constrained Job Compute policy that job clusters must use.
    default: "0005F2031B6D2319"

  # Platform console (resources/optional/platform_console.yml). These are declared here so
  # the bundle parses whether or not the console is opted in; nothing is deployed until
  # that file is added to `include` above. See docs/platform-console.md.
  sdk_artifact_volume:
    description: SDK artifact volume path the console reports on.
    default: /Volumes/dbx_dev/dbx_platform/python_packages
  sdk_artifact_volume_full_name:
    description: >-
      The same volume in dotted Unity Catalog form, which is what an app resource binding
      requires. tests/test_app_resource.py derives this from sdk_artifact_volume so the
      two spellings cannot drift.
    default: dbx_dev.dbx_platform.python_packages
  app_suffix:
    description: >-
      Distinguishes app instances. App names are workspace-global (the CLI applies no
      development-mode prefix to apps), so CI and any individual deployer must differ.
    default: dev
  app_usage_policy_id:
    description: >-
      Serverless usage policy carrying the standard tag set. An app resource has no tags
      field, so this is its only cost-attribution surface.
    default: 4c3c39a5-ffb8-4c18-a5e0-7ddb3bb809b8
  template_repo:
    description: >-
      Git URL of this template hub, used to build the console's `bundle init` command. A
      clone MUST change this or its console would tell developers to generate projects
      from the upstream repository. Cross-checked against platform-identifiers.json by
      tests/test_app_resource.py, so editing the fixture surfaces this line.
    default: https://github.com/HuyD0/aai-dbx-core-starter
  hub_job_mode:
    description: >-
      Reserved Hub workflow adapter selector. Keep unavailable in this delivery:
      remote execution remains gated until a durable reconciler and sanitized result
      ingestion are implemented and approved.
    default: unavailable
  hub_registration_principals:
    description: >-
      Comma-separated non-secret CI service-principal identities allowed to register
      manifests. Empty keeps registration disabled.
    default: ""
  hub_platform_viewer_group:
    description: >-
      Approved account-level fleet viewer group name. A name alone grants no role until
      a trusted server-side membership resolver is configured.
    default: ""
  hub_platform_admin_group:
    description: >-
      Approved account-level Hub administrator group name. Empty keeps administration
      fail-closed.
    default: ""
  hub_platform_auditor_group:
    description: >-
      Approved account-level Hub auditor group name. Empty keeps audit fleet access
      fail-closed.
    default: ""

artifacts:
  default:
    type: whl
    # CI builds before obtaining cloud credentials. Local deploys build on
    # demand when no wheel exists.
    build: python scripts/build_sdk.py

include:
  - resources/*.yml
  - resources/optional/platform_console.yml

# Only a `dev` target for now (per project decision). To add prod later, map it
# to dbx-uat and add a matching federated credential — see docs/cloud-setup.md
# "Adding a prod target".
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405609799238491.11.azuredatabricks.net
    # run_as is left unset, so the bundle deploys and runs as the deploying
    # principal — in CI that is the github-actions-dbx-platform service principal.
    presets:
      # Applied to every job/pipeline in the bundle (organizational attribution
      # + serverless usage reporting). Compute-level attribution that reaches
      # Azure VM billing and system.billing.usage lives on cluster custom_tags —
      # see resources/sample_job.yml. Development mode also auto-adds a `dev` tag
      # identifying the deployer; these keys attribute the *spend*.
      tags:
        application: aai-core
        cost_center: ${var.cost_center}
        team: ${var.team}
        owner_group: ${var.owner_group}
        project: aai-dbx-core-starter
        environment: ${bundle.target}
        data_classification: internal
        lifecycle: experimental
        tag_schema_version: "1"

  # prod:
  #   mode: production
  #   workspace:
  #     host: https://adb-7405613180844632.12.azuredatabricks.net   # dbx-uat
  #   run_as:
  #     service_principal_name: <app-id-of-ci-sp>
