resources:
  jobs:
    aai_dbx_base_template_sample:
      name: "[${bundle.target}] aai-dbx-base-template sample"

      tasks:
        - task_key: sample_etl
          notebook_task:
            # Path is relative to this resource file's directory.
            notebook_path: ../src/notebooks/sample_etl.py
          job_cluster_key: default
          libraries:
            - whl: ../dist/*.whl
            - pypi:
                package: PyYAML==6.0.3

      job_clusters:
        - job_cluster_key: default
          new_cluster:
            spark_version: 18.0.x-scala2.13
            node_type_id: Standard_DS3_v2
            num_workers: 1
            # The workspace's constrained "Job Compute" policy. The dedicated CI
            # principal receives CAN_USE on this policy instead of unrestricted
            # cluster-create or workspace-admin rights. The id comes from a
            # bundle variable so a clone overrides it without editing this file.
            policy_id: ${var.job_compute_policy_id}
            spark_env_vars:
              AAI_ENVIRONMENT: ${var.deployment_environment}
              AAI_LIFECYCLE: ${var.deployment_lifecycle}
              AAI_RELEASE: ${var.deployment_release}
            # Cost-attribution tags. Cluster custom_tags propagate to the
            # underlying Azure VMs (Cost Management / chargeback) and to the
            # system.billing.usage `custom_tags` column for DBU attribution. Values
            # come from bundle variables (see databricks.yml) so each instance sets
            # them without editing this file. NOTE: if the constrained Job Compute
            # policy above fixes or forbids any of these keys, the cluster fails
            # with an invalid-settings error — align the keys with the policy (or
            # enforce them via the policy) if that happens. The `deploy` job in CI
            # is the definitive check (the data plane is unreachable locally).
            custom_tags:
              application: aai-core
              cost_center: ${var.cost_center}
              team: ${var.team}
              owner_group: ${var.owner_group}
              project: aai-dbx-core-starter
              environment: ${bundle.target}
              data_classification: internal
              lifecycle: ${var.deployment_lifecycle}
              tag_schema_version: "2"
