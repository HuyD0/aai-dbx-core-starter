[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aai-core"
version = "0.1.0"
description = "Paved-road SDK for AI and ML applications on Azure Databricks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "AI/ML Platform Team" }]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
databricks = [
  "databricks-ai-search>=0.77,<1",
  "databricks-sdk>=0.60,<1",
  "databricks-openai>=0.9,<1",
]
foundry = [
  "azure-ai-projects>=1.0,<2",
  "azure-identity>=1.19,<2",
  "openai>=1.68,<3",
]
azure-search = [
  "azure-identity>=1.19,<2",
  "azure-search-documents>=11.6,<12",
]
keyvault = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
]
genai = [
  "mlflow[databricks]>=3.1,<4",
]
all = [
  "aai-core[databricks,foundry,azure-search,keyvault,genai]",
]
dev = [
  "black>=24.10,<26",
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
aai-core = "aai_core.diagnostics:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_core"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aai_core", "app"]

[tool.black]
target-version = ["py311", "py312"]
line-length = 88
