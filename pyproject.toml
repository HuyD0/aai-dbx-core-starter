[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "aai-core"
version = "0.4.0"
description = "Paved-road SDK for AI and ML applications on Azure Databricks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "AI/ML Platform Team" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.3,<7",
]

[project.urls]
Documentation = "https://github.com/HuyD0/aai-dbx-core-starter/tree/main/docs"
Issues = "https://github.com/HuyD0/aai-dbx-core-starter/issues"
Repository = "https://github.com/HuyD0/aai-dbx-core-starter"

[project.optional-dependencies]
databricks = [
  "databricks-ai-search>=0.77,<0.78",
  "databricks-sdk>=0.122,<0.123",
  "databricks-openai>=0.17,<0.18",
]
foundry = [
  "azure-identity>=1.25.3,<2",
  "openai>=2.48,<3",
]
foundry-labs = [
  "a2a-sdk>=1.0.3,<1.1",
  "agent-framework-core>=1.12.1,<1.13",
  "azure-ai-projects>=2.4,<3",
  "azure-monitor-opentelemetry>=1.8.9,<2",
  "httpx>=0.28.1,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.43,<1.44",
  "opentelemetry-sdk>=1.43,<1.44",
]
azure-search = [
  "azure-identity>=1.25.3,<2",
  "azure-search-documents>=12,<13",
]
keyvault = [
  "azure-identity>=1.25.3,<2",
  "azure-keyvault-secrets>=4.11,<5",
]
genai = [
  "mlflow[databricks]>=3.15.1,<3.16",
]
examples = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
  "pandas>=2,<3",
]
all = [
  "aai-core[databricks,foundry,azure-search,keyvault,genai]",
]
dev = [
  "black[jupyter]>=26.5.1,<27",
  "build>=1.5,<2",
  "hatchling>=1.31,<2",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.6.1,<5",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
  "types-PyYAML>=6.0.12,<7",
  "zizmor>=1.5,<2",
  # Platform console (src/platform_app). Deliberately NOT a public `app` extra:
  # `pip install aai-core[app]` handing an SDK consumer a web server would misrepresent
  # the published package. Plain `uvicorn`, never uvicorn[standard] — uvloop/httptools/
  # watchfiles are absent from uv.lock. databricks-sdk stays out on purpose so the
  # `dependency:databricks.sdk` doctor check keeps exercising its skip path
  # (tests/conftest.py); the console imports it lazily and degrades to `skip`.
  "fastapi>=0.140,<1",
  "jinja2>=3.1.6,<4",
  "uvicorn>=0.51,<1",
]

[project.scripts]
aai-core = "aai_core.diagnostics:main"
agentkit = "aai_core.agentkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_core"]

[tool.hatch.build.targets.sdist]
# Standalone study projects own separate environments and are not SDK package
# data. Excluding them also prevents local data, models, or experiment artifacts
# from entering a future source release.
exclude = [
  "/examples/local-finetuning",
  "/tests/test_local_finetuning_project.py",
  "/examples/local-classification",
  "/tests/test_local_classification_project.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
# src/platform_app is on the path so tests import `aai_console.server` by exactly the
# name the Apps container uses (its source root is src/platform_app). One import path,
# no namespace-package trickery, nothing that can diverge between test and container.
pythonpath = ["src", "src/platform_app", "examples/local-finetuning/src"]
testpaths = ["tests"]
markers = [
  "generated_project: full rendered-project lint, type, coverage, offline, and wheel gate",
]

[tool.coverage.run]
branch = true
source = ["aai_core"]

[tool.coverage.report]
fail_under = 86
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
packages = ["aai_core"]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
# Provider SDKs are optional and several do not publish complete typing data.
# Boundary adapters are still type-checked against the protocols owned here.
ignore_missing_imports = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# Optional providers and their NumPy stubs expose version-sensitive internal
# graphs. SDK adapters are checked against aai-core-owned protocols instead.
module = [
  "mlflow",
  "numpy",
  "numpy.*",
  "openai",
]
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["examples/local-classification"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["aai_core", "aai_console", "app", "evals", "jobs"]

[tool.ruff.lint.per-file-ignores]
# The separately scoped platform console keeps its existing complexity baseline;
# SDK, examples, and generated application code are subject to C901 <= 12.
"src/platform_app/**/*.py" = ["C901"]

[tool.black]
target-version = ["py311", "py312"]
line-length = 88
extend-exclude = "(^|/)examples/local-classification/"
