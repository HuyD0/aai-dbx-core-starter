[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "aai-core"
version = "0.2.0"
description = "Paved-road SDK for AI and ML applications on Azure Databricks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "AI/ML Platform Team" }]
dependencies = [
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
databricks = [
  "databricks-ai-search>=0.77,<1",
  "databricks-sdk>=0.122,<1",
  "databricks-openai>=0.17,<1",
]
foundry = [
  "azure-ai-projects>=2.3,<3",
  "azure-identity>=1.25.3,<2",
  "openai>=2.48,<3",
]
azure-search = [
  "azure-identity>=1.25.3,<2",
  "azure-search-documents>=12,<13",
]
keyvault = [
  "azure-identity>=1.25.3,<2",
  "azure-keyvault-secrets>=4.11,<5",
]
genai = [
  "mlflow[databricks]>=3.14,<4",
]
examples = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
]
all = [
  "aai-core[databricks,foundry,azure-search,keyvault,genai]",
]
dev = [
  "black>=26.5.1,<27",
  "build>=1.5,<2",
  "hatchling>=1.31,<2",
  "pre-commit>=4.6.1,<5",
  "pytest>=9.1.1,<10",
  "ruff>=0.16,<1",
  "zizmor>=1.5,<2",
]

[project.scripts]
aai-core = "aai_core.diagnostics:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_core"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aai_core", "app", "jobs"]

[tool.black]
target-version = ["py311", "py312"]
line-length = 88
