name: deploy

# Platform onboarding must create a branch-ref FIC for this repository's main
# branch before this workflow is enabled. Do not add a GitHub environment
# without first creating the matching environment-subject FIC.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test before build (credential-free)
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -r requirements-ci.txt
          python -m pip install --no-deps -e .
          python -m pip check
          make PYTHON=python check

      - name: Build application before cloud login
        run: python scripts/build_application.py

      - name: Stage application wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  deploy-dev:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source checkout provenance
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Download prebuilt application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: application-wheel
          path: dist

      - name: Azure login (OIDC — no secret)
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@8b7b124dc4f5b9621e959ea61cf4d3dd4e421f67 # v1.9.0

      - name: Verify externally provisioned Databricks App
        if: ${{ hashFiles('resources/agent_app.yml') != '' }}
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: |
          APP_NAME=$(python -c 'import json; stamp = json.load(open(".aai-template.json")); print(stamp["generated_with"]["application_name"] + "-dev")')
          databricks apps get "$APP_NAME" >/dev/null

      - name: Validate and deploy
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          AAI_USE_PREBUILT_APPLICATION: "1"
        run: |
          databricks bundle validate -t dev --strict
          databricks bundle deploy -t dev

      - name: Run the release gate
        # Every template's bundle names its gate job `release_gate` (the
        # project's tier-2 evaluation). Running it here ENFORCES the gate on
        # the credentialed path: a failing gate fails this workflow, so a
        # validation result that misses safety/quality thresholds never proceeds to
        # promotion. Requires the onboarding grants documented in the README
        # (e.g. CAN_QUERY on the endpoints the evaluation uses).
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle run release_gate -t dev

      - name: Start or update the Databricks App
        if: ${{ hashFiles('resources/agent_app.yml') != '' }}
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
        run: databricks bundle run agent_app -t dev
