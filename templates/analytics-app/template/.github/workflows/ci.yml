name: ci

# Credential-free pull-request checks — the platform's hard boundary for PRs:
# no id-token permission, no azure/login, no secrets. The LLM-judge release
# gate (evals/evaluate.py) runs on the credentialed path instead.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install aai-core (CI source) and project tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Lint and unit tests
        run: |
          ruff check .
          black --check .
          pytest -q

      - name: Offline release-gate checks
        run: python evals/offline_checks.py
