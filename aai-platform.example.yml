platform:
  application: example-assistant
  project: example-ai
  environment: dev
  team: data-platform
  owner_group: group:data-platform-owners
  cost_center: CC-1234
  data_classification: internal
  lifecycle: experimental
  repository: example-org/example-repo
  release: dev
  tag_schema_version: "1"
  catalog: main
  schema: example_ai
  experiment_name: /Shared/example-ai
  azure_identity: azure_cli

providers:
  models:
    # The same logical name resolves differently per environment file — the
    # application code never changes. Two supported paths:
    #
    # 1. Databricks model serving (default; in the enterprise this endpoint is
    #    AI Gateway-enabled, adding rate limits/usage tracking transparently):
    general-chat:
      provider: databricks
      deployment: replace-with-serving-endpoint
      capabilities:
        tool_calling: true
        structured_output: true
      # Optional request policy (defaults: 60s timeout, 2 retries on 429/5xx
      # honoring Retry-After):
      # timeout_seconds: 60
      # max_retries: 2
    #
    # 2. Azure APIM AI gateway (enterprise): keyless Entra bearer token for
    #    the gateway's audience; subscription key only if the enterprise
    #    mandates one for chargeback — and then always a secret REFERENCE.
    # general-chat:
    #   provider: azure_apim
    #   base_url: https://replace-with-apim.azure-api.net/replace-api-suffix
    #   deployment: replace-with-model-deployment
    #   token_scope: api://replace-with-apim-app-id/.default
    #   # api_version: 2025-04-01
    #   # subscription_key: keyvault://replace-with-vault/apim-subscription-key
    #   # subscription_key_header: api-key
  embeddings:
    knowledge-embedding:
      provider: databricks
      deployment: replace-with-embedding-endpoint
      dimensions: 1536
  retrievers:
    product-knowledge:
      provider: azure_ai_search
      endpoint: https://replace-with-search-service.search.windows.net
      index: replace-with-index
      id_field: id
      content_field: content
      source_uri_field: source_uri
      chunk_id_field: chunk_id
      vector_fields: [content_vector]
      # Lets retriever.search("question") embed the query automatically for
      # vector/hybrid modes:
      embedding: knowledge-embedding

# References only. Never place secret values in this file.
secrets:
  optional_vendor_key: keyvault://replace-with-vault/vendor-api-key
