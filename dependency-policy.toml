schema_version = 1

[python]
supported = ["3.11", "3.12"]
default = "3.12"

[resolution]
certified_lock = "uv.lock"
minimum_resolution = "lowest-direct"
latest_resolution = "highest"
template_lock_format = "universal-transitive-v1"
template_transitive_locking = "enforced"

[updates]
stable_runtime = "weekly"
runtime_minor = "monthly"
preview = "monthly-after-canary"
platform_toolchain = "quarterly"
security_critical_sla_hours = 24
security_high_sla_hours = 72

[packages.PyYAML]
supported = ">=6.0.3,<7"
certified = "6.0.3"
maturity = "stable"
family = "core"

[packages.a2a-sdk]
supported = ">=1.0.3,<1.1"
certified = "1.0.3"
maturity = "preview"
family = "agent-interoperability"
note = "Curriculum-only preview dependency; A2A v1.0 is preferred for new Foundry integrations."

[packages.agent-framework-core]
supported = ">=1.12.1,<1.13"
certified = "1.12.1"
maturity = "stable"
family = "application-framework"
note = "Curriculum uses native ContextProvider and OpenTelemetry APIs without wrapping them in aai-core."

[packages.azure-ai-projects]
supported = ">=2.4,<3"
certified = "2.4.0"
maturity = "stable-with-preview-agent-apis"
family = "azure-openai"

[packages.azure-monitor-opentelemetry]
supported = ">=1.8.9,<2"
certified = "1.8.9"
maturity = "stable"
family = "observability"

[packages.azure-identity]
supported = ">=1.25.3,<2"
certified = "1.25.3"
maturity = "stable"
family = "azure-openai"

[packages.azure-keyvault-secrets]
supported = ">=4.11,<5"
certified = "4.11.0"
maturity = "stable"
family = "azure-openai"

[packages.azure-search-documents]
supported = ">=12,<13"
certified = "12.0.0"
maturity = "stable"
family = "azure-openai"

[packages.databricks-agents]
supported = ">=1.11,<2"
certified = "1.11.0"
maturity = "preview"
family = "mlflow-agents"
note = "Template-owned until the aai-core serving extra is published."

[packages.databricks-ai-search]
supported = ">=0.77,<0.78"
certified = "0.77"
maturity = "preview"
family = "databricks-clients"

[packages.databricks-openai]
supported = ">=0.17,<0.18"
certified = "0.17.0"
maturity = "preview"
family = "databricks-clients"

[packages.databricks-sdk]
supported = ">=0.122,<0.123"
certified = "0.122.0"
maturity = "preview"
family = "databricks-clients"

[packages.httpx]
supported = ">=0.28.1,<1"
certified = "0.28.1"
maturity = "stable"
family = "core"

[packages.langgraph]
supported = ">=1.2,<1.3"
certified = "1.2.9"
maturity = "stable"
family = "application-framework"
note = "Optional agent-template recipe; aai-core does not wrap graph APIs."

[packages.langchain]
supported = ">=1.3,<1.4"
certified = "1.3.14"
maturity = "preview"
family = "application-framework"
note = "Required by MLflow LangChain autologging; native framework contracts remain unwrapped."

[packages.langgraph-checkpoint-postgres]
supported = ">=3.1,<4"
certified = "3.1.2"
maturity = "stable"
family = "application-framework"
note = "Optional agent-template Lakebase persistence recipe; aai-core does not wrap checkpoint APIs."

[packages.psycopg]
supported = ">=3.2.1,<4"
certified = "3.3.4"
maturity = "stable"
family = "application-framework"
note = "PostgreSQL driver for the Lakebase persistence recipe; the platform console pins it independently through uv.lock."

[packages.psycopg-pool]
supported = ">=3.2,<4"
certified = "3.3.1"
maturity = "stable"
family = "application-framework"
note = "Async connection pooling for the Lakebase persistence recipe; new connections mint fresh OAuth tokens."

[packages.mlflow]
supported = ">=3.15.1,<3.16"
certified = "3.15.1"
maturity = "stable-with-preview-genai-apis"
family = "mlflow-agents"

[packages.openai]
supported = ">=2.48,<3"
